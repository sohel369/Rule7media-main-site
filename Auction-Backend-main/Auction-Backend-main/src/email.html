<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password Reset OTP</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f4f4;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width: 600px; margin: 0 auto; background: #fff;">
    <!-- Header: Full-Width Image (like a page header) -->
    <tr>
      <td style="padding: 0; margin: 0; text-align: center;">
        <img src="cid:header" alt="Header" style="width: 100%; max-width: 600px; display: block;">
      </td>
    </tr>
    <!-- Main Content: OTP Section centered on the page -->
    <tr>
      <td style="padding: 40px 20px; text-align: center;">
        <h2 style="color: #0056b3; margin-bottom: 20px;">Password Reset OTP</h2>
        <p style="font-size: 16px; margin-bottom: 10px;">Dear User,</p>
        <p style="font-size: 16px; margin-bottom: 10px;">Your OTP for password reset is:</p>
        <!-- OTP Box -->
        <div style="margin: 30px auto; background: #f3f3f3; padding: 15px; border-radius: 5px; font-size: 32px; font-weight: bold; color: #d9534f; display: inline-block;">
          ${otp}
        </div>
        <p style="font-size: 14px; margin-bottom: 5px;">This OTP is valid for 10 minutes.</p>
        <p style="font-size: 14px;">If you did not request this, please ignore this email.</p>
      </td>
    </tr>
    <!-- Footer: Full-Width Image (like a page footer) -->
    <tr>
      <td style="padding: 0; margin: 0; text-align: center;">
        <img src="cid:footer" alt="Footer" style="width: 100%; max-width: 600px; display: block;">
      </td>
    </tr>
  </table>
</body>
</html>
